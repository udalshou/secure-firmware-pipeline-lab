# OpenSSF Scorecard rates the repository's own security practices (branch
# protection, pinned dependencies, token permissions, signed releases, ...).
# Results go to code scanning and to the public Scorecard API, which backs the
# README badge. Publishing requires this exact shape: read-only workflow
# token, no top-level env or defaults, and only the job permissions below.
name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule: # rescore when protection changes
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published result (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: scorecard.sarif
          category: scorecard
