# Kernel modules the appliance never needs: rare network protocols with a
# history of remote bugs, and removable storage buses (data theft, BadUSB
# storage). "install ... /bin/false" also blocks loading as a dependency.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install usb-storage /bin/false
install firewire-core /bin/false
install thunderbolt /bin/false
